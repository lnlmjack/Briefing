<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Proposta - Jack Ilusionista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050507; color: #f4f4f5; }
    .font-gold { font-family: 'Cinzel', serif; }
    .gold-btn { background: linear-gradient(135deg, #fce082 0%, #d4af37 50%, #996515 100%); color: #000; }
    input::placeholder, textarea::placeholder { text-transform: none; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-lg bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600"></div>
    
    <div class="text-center space-y-2 mb-8">
      <div class="w-16 h-16 mx-auto bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center text-amber-400 text-2xl mb-4">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <h1 class="font-gold text-2xl font-bold text-white uppercase tracking-wider">Jack Ilusionista</h1>
      <p class="text-xs text-zinc-400">Preencha os detalhes do seu evento para receber uma proposta exclusiva.</p>
    </div>

    <form id="formLead" class="space-y-4" onsubmit="enviarPedido(event)">
      <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Nome</label>
      <input type="text" id="cliente" required class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="O seu nome ou da empresa"></div>
      
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Data (DD/MM/AAAA)</label>
        <input type="text" id="data" required oninput="mascaraData(event)" maxlength="10" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="Ex: 25/11/2026"></div>
        <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Horário (XX:XX)</label>
        <input type="text" id="horario" required oninput="mascaraHora(event)" maxlength="5" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="Ex: 20:00"></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Convidados</label>
        <input type="text" id="convidados" required class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="Quantas pessoas?"></div>
        <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Tipo de Festa</label>
        <input type="text" id="tipo" required class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="Ex: Casamento"></div>
      </div>

      <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Local / Bairro / Cidade</label>
      <input type="text" id="local" required class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" placeholder="Onde será o evento?"></div>
      
      <div><label class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Detalhes (Opcional)</label>
      <textarea id="obs" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase focus:border-amber-400 outline-none transition" rows="2" placeholder="Alguma observação importante?"></textarea></div>

      <button type="submit" id="btnEnviar" class="w-full py-4 mt-2 gold-btn rounded-xl font-bold uppercase tracking-widest hover:brightness-110 transition shadow-[0_0_15px_rgba(212,175,55,0.3)]">
        Solicitar Proposta
      </button>
    </form>

    <div id="msgSucesso" class="hidden text-center py-10 space-y-4">
      <div class="w-20 h-20 mx-auto bg-green-500/20 text-green-400 rounded-full flex items-center justify-center text-4xl mb-4 border border-green-500/40">
        <i class="fa-solid fa-check"></i>
      </div>
      <h2 class="font-gold text-2xl font-bold text-white">Pedido Enviado!</h2>
      <p class="text-sm text-zinc-400">Estamos preparando a sua proposta com as melhores opções para seu evento.</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ilvzmuvxloqrpqbuyvrb.supabase.co";
    const SUPABASE_ANON = "sb_publishable_KIGYo0gheSoB6DqG_o6IxQ_ceB2xcww";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function mascaraData(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 8) v = v.substring(0, 8);
      if (v.length >= 5) v = v.replace(/(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
      else if (v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/, '$1/$2');
      e.target.value = v;
    }

    function mascaraHora(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 4) v = v.substring(0, 4);
      if (v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/, '$1:$2');
      e.target.value = v;
    }

    async function enviarPedido(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> A enviar...';
      btn.disabled = true;

      // Código blindado para evitar erros com campos vazios (null)
      const payload = {
        cliente: (document.getElementById('cliente')?.value || '').toUpperCase(),
        data_evento: (document.getElementById('data')?.value || '').toUpperCase(),
        horario: (document.getElementById('horario')?.value || '').toUpperCase(),
        convidados: (document.getElementById('convidados')?.value || '').toUpperCase(),
        tipo_festa: (document.getElementById('tipo')?.value || '').toUpperCase(),
        local: (document.getElementById('local')?.value || '').toUpperCase(),
        observacoes: (document.getElementById('obs')?.value || '').toUpperCase(),
        shows: []
      };

      try {
        const { error } = await supabaseClient.from('propostas').insert([payload]);
        if (error) throw error;
        document.getElementById('formLead').classList.add('hidden');
        document.getElementById('msgSucesso').classList.remove('hidden');
      } catch (err) {
        alert("Erro ao enviar: " + err.message);
        btn.innerHTML = 'Solicitar Proposta';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
