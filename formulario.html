<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Pedido - Jack Ilusionista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050507; color: #f4f4f5; }
    .gold-btn { background: linear-gradient(135deg, #fce082 0%, #d4af37 50%, #996515 100%); color: #000; font-weight: 800; }
  </style>
</head>
<body class="p-4 sm:p-6 pb-20">
  <div class="max-w-2xl mx-auto space-y-8">

    <div class="bg-zinc-900 border border-zinc-800 p-6 sm:p-8 rounded-3xl shadow-2xl">
      <div class="flex items-center gap-4 border-b border-zinc-800 pb-4 mb-6">
        <div class="w-12 h-12 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-xl">
          <i class="fa-solid fa-file-pen"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-white">Solicitar Proposta</h1>
          <p class="text-xs text-zinc-400">Preencha os dados do seu evento</p>
        </div>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Nome do Cliente / Contratante</label>
          <input type="text" id="form_cliente" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase" placeholder="EX: JOÃO E MARIA">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-zinc-400 block mb-1">Data (DD/MM/AAAA)</label>
            <input type="text" id="form_data" oninput="mascaraData(event)" maxlength="10" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="EX: 25/11/2026">
          </div>
          <div>
            <label class="text-xs text-zinc-400 block mb-1">Horário (XX:XX)</label>
            <input type="text" id="form_horario" oninput="mascaraHora(event)" maxlength="5" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="EX: 20:00">
          </div>
          <div>
            <label class="text-xs text-zinc-400 block mb-1">Convidados</label>
            <input type="text" id="form_convidados" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase" placeholder="EX: 150 PESSOAS">
          </div>
          <div>
            <label class="text-xs text-zinc-400 block mb-1">Tipo de Festa</label>
            <input type="text" id="form_tipo" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase" placeholder="EX: CASAMENTO">
          </div>
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Local / Cidade</label>
          <input type="text" id="form_local" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase" placeholder="EX: ESPAÇO MEET - BH">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Observações do Evento</label>
          <textarea id="form_obs" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm uppercase" rows="3" placeholder="EX: CLIENTE PEDIU FOCO EM MÁGICA..."></textarea>
        </div>

        <button id="btnEnviar" onclick="enviarFormulario()" class="w-full py-4 gold-btn rounded-xl uppercase tracking-widest mt-4 shadow-xl hover:scale-[1.01] active:scale-95 transition text-sm">
          <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Pedido de Proposta
        </button>

        <!-- PÁGINA / BLOCO DE CONFIRMAÇÃO RESTAURADO -->
        <div id="formResultado" class="hidden mt-4 p-5 bg-zinc-950 border border-amber-400/50 rounded-2xl text-center space-y-3">
          <p class="text-sm font-bold text-amber-400"><i class="fa-solid fa-circle-check mr-2"></i> Pedido enviado com sucesso!</p>
          <p class="text-xs text-zinc-300">Obrigado! O seu pedido foi registado no sistema do Jack Ilusionista. Entraremos em contacto muito em breve.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ilvzmuvxloqrpqbuyvrb.supabase.co";
    const SUPABASE_ANON = "sb_publishable_KIGYo0gheSoB6DqG_o6IxQ_ceB2xcww";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function mascaraData(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 8) v = v.substring(0, 8);
      if (v.length >= 5) v = v.replace(/(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
      else if (v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/, '$1/$2');
      e.target.value = v;
    }

    function mascaraHora(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 4) v = v.substring(0, 4);
      if (v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/, '$1:$2');
      e.target.value = v;
    }

    async function enviarFormulario() {
      const btn = document.getElementById('btnEnviar');
      const nomeInput = document.getElementById('form_cliente').value.trim();

      if (!nomeInput) {
        alert("Por favor, preencha o nome do cliente/contratante.");
        return;
      }

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> A enviar...';

      const payload = {
        cliente: nomeInput.toUpperCase(),
        data_evento: document.getElementById('form_data').value.trim().toUpperCase(),
        horario: document.getElementById('form_horario').value.trim().toUpperCase(),
        convidados: document.getElementById('form_convidados').value.trim().toUpperCase(),
        tipo_festa: document.getElementById('form_tipo').value.trim().toUpperCase(),
        local: document.getElementById('form_local').value.trim().toUpperCase(),
        observacoes: document.getElementById('form_obs').value.trim().toUpperCase(),
        shows: []
      };

      try {
        const { error } = await supabaseClient.from('propostas').insert([payload]);
        if (error) throw error;

        // Esconde o formulário e mostra a confirmação de sucesso
        document.getElementById('formResultado').classList.remove('hidden');
        btn.classList.add('hidden');

      } catch (err) {
        alert("Erro ao enviar o pedido: " + err.message);
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Enviar Pedido de Proposta';
      }
    }
  </script>
</body>
</html>
