<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Jack Ilusionista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050507; color: #f4f4f5; }
    .gold-btn { background: linear-gradient(135deg, #fce082 0%, #d4af37 50%, #996515 100%); color: #000; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-3xl mx-auto bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl">
    <h1 class="text-2xl font-bold text-amber-400 mb-6 border-b border-zinc-800 pb-4">Gerador de Propostas - Jack Ilusionista</h1>
    
    <div class="space-y-6">
      <!-- DADOS DO EVENTO -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="text-xs text-zinc-400 block mb-1">Nome do Cliente</label><input type="text" id="cliente" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: João e Maria"></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Data do Evento</label><input type="text" id="data" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: 25 de Novembro de 2026"></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Horário</label><input type="text" id="horario" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: 20h00"></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Convidados</label><input type="text" id="convidados" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: 150 pessoas"></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Tipo de Festa</label><input type="text" id="tipo" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: Casamento"></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Local / Cidade</label><input type="text" id="local" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" placeholder="Ex: Espaço Meet - BH"></div>
      </div>
      <div>
        <label class="text-xs text-zinc-400 block mb-1">Observações (Opcional)</label>
        <textarea id="obs" class="w-full p-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white text-sm" rows="2" placeholder="Detalhes extras que aparecem na proposta..."></textarea>
      </div>

      <!-- SELEÇÃO DE MODALIDADES PADRÃO -->
      <div class="pt-6 border-t border-zinc-800">
        <h2 class="text-lg font-bold text-white mb-4">Quais shows oferecer? (Padrão)</h2>
        <div class="space-y-3">
          <div class="flex items-center gap-3"><input type="checkbox" id="cb_vegas" value="Las Vegas é Aqui" class="w-5 h-5 show-cb"><label class="text-sm font-semibold flex-1">Las Vegas é Aqui</label><input type="text" id="preco_vegas" placeholder="R$ 1.200,00" class="w-32 p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs"></div>
          <div class="flex items-center gap-3"><input type="checkbox" id="cb_enganacao" value="Uma Hora de Enganação" class="w-5 h-5 show-cb"><label class="text-sm font-semibold flex-1">Uma Hora de Enganação</label><input type="text" id="preco_enganacao" placeholder="R$ 1.990,00" class="w-32 p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs"></div>
          <div class="flex items-center gap-3"><input type="checkbox" id="cb_misto" value="Show Misto" class="w-5 h-5 show-cb"><label class="text-sm font-semibold flex-1">Show Misto</label><input type="text" id="preco_misto" placeholder="R$ 2.600,00" class="w-32 p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs"></div>
          <div class="flex items-center gap-3"><input type="checkbox" id="cb_infantil" value="Brincando com o Impossível" class="w-5 h-5 show-cb"><label class="text-sm font-semibold flex-1">Brincando com o Impossível</label><input type="text" id="preco_infantil" placeholder="R$ 1.990,00" class="w-32 p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs"></div>
          <div class="flex items-center gap-3"><input type="checkbox" id="cb_corp" value="Mágica e Humor Corporativo" class="w-5 h-5 show-cb"><label class="text-sm font-semibold flex-1">Mágica e Humor Corporativo</label><input type="text" id="preco_corp" placeholder="Sob Consulta" class="w-32 p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs"></div>
        </div>
      </div>

      <!-- MODALIDADE PERSONALIZADA NA HORA -->
      <div class="pt-6 border-t border-zinc-800 bg-amber-500/5 p-4 rounded-2xl border border-amber-500/20 mt-6">
        <h2 class="text-sm font-bold text-amber-400 mb-2 uppercase tracking-wider">Criar Modalidade Personalizada</h2>
        <p class="text-[10px] text-zinc-400 mb-4">Preencha apenas se quiser enviar um show exclusivo que não está na lista acima.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Nome do Show</label><input type="text" id="cust_nome" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: Intervenção VIP"></div>
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Preço</label><input type="text" id="cust_preco" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: R$ 3.500,00"></div>
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Etiqueta Dourada</label><input type="text" id="cust_tag" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: Exclusivo / Premium"></div>
          <div class="sm:col-span-2"><label class="text-[10px] text-zinc-500 uppercase block mb-1">Descrição do Show (pode usar 'Enter' para parágrafos)</label><textarea id="cust_desc" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" rows="3" placeholder="Digite o texto de apresentação..."></textarea></div>
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Porte / Ambiente</label><input type="text" id="cust_porte" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: Evento de Luxo"></div>
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Público</label><input type="text" id="cust_publico" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: Adultos"></div>
          <div><label class="text-[10px] text-zinc-500 uppercase block mb-1">Duração</label><input type="text" id="cust_duracao" class="w-full p-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-white" placeholder="Ex: 40 minutos"></div>
        </div>
      </div>

      <!-- BOTÃO GERAR -->
      <button onclick="gerarProposta()" class="w-full py-4 gold-btn rounded-xl font-bold uppercase tracking-widest mt-6">Gerar Proposta e Criar Link</button>

      <!-- RESULTADO -->
      <div id="resultado" class="hidden mt-6 p-5 bg-zinc-950 border border-amber-400 rounded-2xl text-center space-y-3">
        <p class="text-sm text-zinc-300">Link gerado com sucesso!</p>
        <input type="text" id="linkGerado" class="w-full p-3 bg-black text-amber-400 text-xs rounded-lg border border-zinc-800 text-center" readonly>
        <button onclick="copiarLink()" class="px-6 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold rounded-lg uppercase transition">Copiar Link</button>
        <a id="btnAbrir" href="#" target="_blank" class="px-6 py-2 bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold rounded-lg uppercase transition inline-block">Abrir Proposta</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ilvzmuvxloqrpqbuyvrb.supabase.co";
    const SUPABASE_ANON = "sb_publishable_KIGYo0gheSoB6DqG_o6IxQ_ceB2xcww";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    async function gerarProposta() {
      const shows = [];
      
      // Shows Padrões Marcados
      const cbs = [
        {id: 'cb_vegas', input: 'preco_vegas'},
        {id: 'cb_enganacao', input: 'preco_enganacao'},
        {id: 'cb_misto', input: 'preco_misto'},
        {id: 'cb_infantil', input: 'preco_infantil'},
        {id: 'cb_corp', input: 'preco_corp'}
      ];

      cbs.forEach(item => {
        const cb = document.getElementById(item.id);
        if(cb.checked) {
          shows.push({
            nome: cb.value,
            preco: document.getElementById(item.input).value || "Sob Consulta",
            isCustom: false
          });
        }
      });

      // Show Personalizado
      const custNome = document.getElementById('cust_nome').value;
      if(custNome.trim() !== "") {
        shows.push({
          isCustom: true,
          nome: custNome,
          preco: document.getElementById('cust_preco').value || "Sob Consulta",
          tag: document.getElementById('cust_tag').value || "Exclusivo",
          desc: document.getElementById('cust_desc').value || "",
          porte: document.getElementById('cust_porte').value || "Personalizado",
          publico: document.getElementById('cust_publico').value || "Geral",
          duracao: document.getElementById('cust_duracao').value || "A combinar"
        });
      }

      const payload = {
        cliente: document.getElementById('cliente').value,
        data_evento: document.getElementById('data').value,
        horario: document.getElementById('horario').value,
        convidados: document.getElementById('convidados').value,
        tipo_festa: document.getElementById('tipo').value,
        local: document.getElementById('local').value,
        observacoes: document.getElementById('obs').value,
        shows: shows
      };

      try {
        const { data, error } = await supabaseClient.from('propostas').insert([payload]).select();
        if (error) throw error;
        
        // Usa o domínio da Vercel em que o admin está hospedado automaticamente
        const linkOficial = window.location.origin + '/briefing.html?id=' + data[0].id;
        
        document.getElementById('linkGerado').value = linkOficial;
        document.getElementById('btnAbrir').href = linkOficial;
        document.getElementById('resultado').classList.remove('hidden');
      } catch (err) {
        alert("Erro ao salvar: " + err.message);
      }
    }

    function copiarLink() {
      const input = document.getElementById('linkGerado');
      input.select();
      document.execCommand('copy');
      alert('Link copiado!');
    }
  </script>
</body>
</html>
